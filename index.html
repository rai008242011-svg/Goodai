<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ORRERY">
<meta name="theme-color" content="#02060a">
<title>ORRERY</title>
<style>
:root{--c:#33ddff;--c2:#a0f0ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#02060a;color:var(--c);font-family:ui-monospace,Menlo,"Hiragino Sans",monospace;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);pointer-events:none}
#clock{font-size:32px;font-weight:700;letter-spacing:.06em;color:var(--c2);text-shadow:0 0 14px var(--c)}
#date,#src,#cname{font-size:12px;opacity:.75;letter-spacing:.06em}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.top .r{text-align:right}
.bot{display:flex;flex-direction:column;gap:8px}
#log{max-height:22vh;overflow:auto;border:1px solid var(--c);border-radius:12px;background:rgba(0,0,0,.6);padding:8px 12px;font-size:13px;line-height:1.5;pointer-events:auto;display:none;-webkit-user-select:text;user-select:text}
#log .y{opacity:.65}
#log .a{color:var(--c2)}
#log .s{color:#ff8a8a}
.wx{border:1px solid var(--c);border-radius:12px;background:rgba(0,0,0,.45);padding:8px 12px;pointer-events:auto}
.now{display:flex;justify-content:space-between;align-items:baseline}
#tmp{font-size:22px;font-weight:700;color:var(--c2)}
#lbl,#sub{font-size:12px}
#sub{opacity:.7}
.fc{display:none;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px;text-align:center;border-top:1px solid var(--c);padding-top:8px;margin-top:6px}
.wx.open .fc{display:grid}
.fc b{display:block;font-weight:400;opacity:.7}
#tx{display:none;gap:8px;pointer-events:auto}
#tx input{flex:1;font:inherit;font-size:16px;color:var(--c2);background:rgba(0,0,0,.65);border:1px solid var(--c);border-radius:10px;padding:10px 12px;outline:none;-webkit-user-select:text;user-select:text}
.btns{display:flex;gap:6px}
button{flex:1;pointer-events:auto;font:inherit;font-size:12px;color:var(--c);background:rgba(0,0,0,.5);border:1px solid var(--c);border-radius:10px;padding:13px 0}
button.talk{flex:1.7;font-size:14px;font-weight:700}
button:active,button.on{background:var(--c);color:#000}
#tx button{flex:none;padding:0 16px}
#vp{display:none;flex-direction:column;gap:8px;font-size:12px;max-height:46vh;overflow:auto}
#vp select{font:inherit;font-size:16px;color:var(--c2);background:rgba(0,0,0,.65);border:1px solid var(--c);border-radius:8px;padding:8px}
#vp label{display:flex;align-items:center;gap:8px}
#vp input[type=range]{flex:1;accent-color:var(--c)}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="ui">
  <div class="top">
    <div><div id="clock">--:--:--</div><div id="date"></div></div>
    <div class="r"><div id="src">待機中</div><div id="cname"></div></div>
  </div>
  <div class="bot">
    <div id="log"><div class="y" id="ly"></div><div class="a" id="la"></div><div id="lm" style="opacity:.45;font-size:11px"></div><div class="s" id="ls"></div></div>
    <div class="wx" id="wx">
      <div class="now"><span id="tmp">--°</span><span id="lbl">取得中</span></div>
      <div id="sub"></div>
      <div class="fc" id="fc"></div>
    </div>
    <div class="wx" id="vp">
      <select id="vs"></select>
      <label>速さ<input type="range" id="vr" min="0.7" max="1.5" step="0.05"></label>
      <label>高さ<input type="range" id="vt" min="0.5" max="1.5" step="0.05"></label>
      <button id="vtest">試し聞き</button>
      <div style="border-top:1px solid var(--c);padding-top:8px;opacity:.8">マイクの設定（白い線を超えると、話していると判断します）</div>
      <div style="position:relative;height:10px;border:1px solid var(--c);border-radius:5px;overflow:hidden"><div id="mbar" style="height:100%;background:var(--c);width:0"></div><div id="mth" style="position:absolute;top:0;bottom:0;width:2px;background:#fff"></div></div>
      <label>感度<input type="range" id="ss" min="0.4" max="3" step="0.1"></label>
      <label>割込<input type="range" id="sb" min="0.4" max="3" step="0.1"></label>
      <label>待ち<input type="range" id="sg" min="0.5" max="2.5" step="0.1"></label>
      <div style="opacity:.6">感度: 上げると小さい声も拾う／割込: 上げるとAIの話を止めやすい／待ち: 話し終わりと判断するまでの秒数</div>
      <label><input type="checkbox" id="cn">ノイズ除去</label>
      <label><input type="checkbox" id="ce">エコー除去</label>
      <label><input type="checkbox" id="ca">自動音量</label>
      <button id="sreset">マイク設定を初期値に戻す</button>
    </div>
    <div id="tx"><input id="ti" type="text" placeholder="ここに入力して送信" enterkeyhint="send" autocomplete="off"><button id="ts">送信</button></div>
    <div class="btns">
      <button class="talk" id="bk">話す</button>
      <button id="bx">文字</button>
      <button id="bv">設定</button>
      <button id="bt">テーマ</button>
    </div>
  </div>
</div>
<script>
const TH={ARC:['#33ddff','#a0f0ff'],EMBER:['#ff8a2a','#ffd49a'],MATRIX:['#2dff6a','#b8ffcc'],CRIMSON:['#ff2d55','#ffa0b2'],MONO:['#e6e6e6','#ffffff']};
const THN=Object.keys(TH);
const CITY=[['FUKUI',36.07,136.22]];
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let ti=store.get('ti',0)%THN.length, ci=0, geo=store.get('geo',null);
if(ci>CITY.length||(ci===CITY.length&&!geo))ci=0;

function applyTheme(){
  const [a,b]=TH[THN[ti]];
  document.documentElement.style.setProperty('--c',a);
  document.documentElement.style.setProperty('--c2',b);
  $('bt').textContent=THN[ti];
}
function place(){return ci<CITY.length?CITY[ci]:['現在地',geo[0],geo[1]]}

/* 時計 */
function tick(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  $('clock').textContent=p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  $('date').textContent=d.toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'});
}
setInterval(tick,1000);tick();

/* 天気 (Open-Meteo) */
let wxs='';
function wx(c){
  if(c===0)return'快晴';if(c<=2)return'晴れ';if(c===3)return'くもり';if(c<=48)return'霧';
  if(c<=57)return'霧雨';if(c<=67)return'雨';if(c<=77)return'雪';if(c<=82)return'にわか雨';
  if(c<=86)return'にわか雪';return'雷雨';
}
async function weather(){
  const [n,la,lo]=place();
  $('cname').textContent=n;
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude='+la+'&longitude='+lo+
      '&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m'+
      '&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5';
    const r=await fetch(u);if(!r.ok)throw new Error(r.status);
    const j=await r.json(),c=j.current;
    $('tmp').textContent=Math.round(c.temperature_2m)+'°C';
    $('lbl').textContent=wx(c.weather_code);
    $('sub').textContent='湿度 '+c.relative_humidity_2m+'%  風 '+c.wind_speed_10m+'km/h  （タップで予報）';
    wxs='天気 '+n+' '+Math.round(c.temperature_2m)+'度 '+wx(c.weather_code);
    let h='';
    for(let i=1;i<5;i++){
      const w=new Date(j.daily.time[i]+'T00:00').toLocaleDateString('ja-JP',{weekday:'short'});
      h+='<div><b>'+w+'</b>'+wx(j.daily.weather_code[i])+'<br>'+Math.round(j.daily.temperature_2m_max[i])+'/'+Math.round(j.daily.temperature_2m_min[i])+'°</div>';
    }
    $('fc').innerHTML=h;
  }catch(e){
    $('tmp').textContent='--°';$('lbl').textContent='取得失敗';
    $('sub').textContent='通信を確認して、地点ボタンで再取得してください';wxs='';
  }
}
$('wx').onclick=()=>$('wx').classList.toggle('open');

/* 状態 */
let st='idle';
const STL={idle:'待機中',listen:'聞き取り中',think:'解析中',speak:'話しています'};
function setSt(s){
  st=s;stSince=Date.now();$('src').textContent=micOn&&s==='idle'?'聞いています':STL[s];
  $('bk').textContent=micOn?'マイクをOFFにする':'マイクON';
  $('bk').classList.toggle('on',micOn);
}
function show(kind,text){
  $('log').style.display='block';
  if(kind==='you'){$('ly').textContent='あなた: '+text;$('la').textContent='';$('ls').textContent='';$('lm').textContent=''}
  else if(kind==='ai'){$('la').textContent='ORRERY: '+text}
  else{$('ls').textContent=text}
  $('log').scrollTop=$('log').scrollHeight;
}

/* 会話 */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let hist=store.get('hist',[]),spTok=0,hold=0,stSince=Date.now(),vname=store.get('vname',''),vrate=store.get('vrate',1.05),vpitch=store.get('vpitch',1),ns=store.get('ns',true),ec=store.get('ec',true),agc=store.get('agc',true),sens=store.get('sens',1),bsens=store.get('bsens',1),gap=store.get('gap',1),lastRms=0,lastBase=.015,vpOpen=false,turnId=0,carry='',ctl=null;
function ctx(){
  const d=new Date();
  return '日時 '+d.toLocaleString('ja-JP',{dateStyle:'full',timeStyle:'short'})+(wxs?'、'+wxs:'');
}
async function post(retry){
  const h={'content-type':'application/json'};
  const pw=store.get('pw','');if(pw)h['x-pass']=pw;
  ctl=new AbortController();
  const res=await fetch('/api/chat',{method:'POST',headers:h,signal:ctl.signal,body:JSON.stringify({messages:hist,context:ctx()})});
  if(res.status===401&&!retry){
    const p=prompt('合言葉を入力してください');
    if(p){store.set('pw',p);return post(true)}
  }
  if(res.status===404)throw new Error('サーバー側（api/chat.js）が見つかりません。Vercelに公開して開いてください');
  const j=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(j.error||('通信エラー '+res.status));
  return j;
}
function drop(m){const i=hist.indexOf(m);if(i>=0)hist.splice(i,1)}
async function ask(text){
  const my=turnId,msg={role:'user',content:text};
  show('you',text);
  hist.push(msg);
  setSt('think');
  try{
    const j=await post();
    if(my!==turnId){drop(msg);carry=text;return}
    const r=j.reply;
    hist.push({role:'assistant',content:r});
    hist=hist.slice(-16);store.set('hist',hist);
    show('ai',r);if(j.model)$('lm').textContent='モデル: '+j.model;
    speak(r);
  }catch(e){
    drop(msg);
    if(my!==turnId){carry=text;return}
    setSt('idle');show('sys',String(e.message||e));
  }
}
function muteMic(b){if(ms)ms.getAudioTracks().forEach(t=>t.enabled=!b)}
function resumeAc(){if(ac&&ac.state!=='running')ac.resume().catch(()=>{})}
function speakDone(my){
  if(my!==spTok)return;
  hold=performance.now()+400;muteMic(false);resumeAc();setSt('idle');
}
function speak(text,retried){
  const syn=window.speechSynthesis;
  if(!syn){setSt('idle');return}
  syn.cancel();const my=++spTok;
  const parts=text.replace(/[*#`_>]/g,'').split(/(?<=[。！？!?\n])/).map(s=>s.trim()).filter(Boolean);
  if(!parts.length){setSt('idle');return}
  if(retried)muteMic(true);
  const vs=syn.getVoices().filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith('ja'));
  const vv=vs.find(v=>v.name===vname)||vs[0];
  const t0=setTimeout(()=>{
    if(my!==spTok||st!=='think')return;
    spTok++;try{syn.cancel()}catch(e){}
    muteMic(false);
    if(!retried){
      show('sys','読み上げが始まらなかったので、もう一度読み上げます');
      speak(text,true);
    }else{setSt('idle');show('sys','この端末では読み上げを始められませんでした')}
  },2500);
  setTimeout(()=>{if(my===spTok&&st!=='idle')speakDone(my)},3000+text.length*300);
  parts.forEach((p,i)=>{
    const u=new SpeechSynthesisUtterance(p);
    u.lang='ja-JP';u.rate=vrate;u.pitch=vpitch;
    if(vv)u.voice=vv;
    if(i===0)u.onstart=()=>{if(my===spTok){clearTimeout(t0);setSt('speak')}};
    if(i===parts.length-1)u.onend=()=>speakDone(my);
    u.onerror=()=>{if(i===parts.length-1)speakDone(my)};
    syn.speak(u);
  });
}

$('bx').onclick=()=>{const t=$('tx');const o=t.style.display==='flex';t.style.display=o?'none':'flex';if(!o)$('ti').focus()};
function sendText(){
  const v=$('ti').value.trim();if(!v||st==='think')return;
  $('ti').value='';
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}
  ask(v);
}
$('ts').onclick=sendText;
$('ti').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)sendText()});

/* 環境音（マイクの音に反応） */
const cv=$('cv'),g=cv.getContext('2d');
let W,H,D,an=null,fd=null,lv=0,micOn=false,ms=null,ac=null,wl=null;
function rs(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0)}
addEventListener('resize',rs);rs();
/* マイクエンジン: 一度の許可で開きっぱなし。声を見つけて録音→文字起こし→会話。AIが話している間に話すと、読み上げを止めて聞き取る */
let proc=null,pre=[],buf=[],talking=false,vHi=0,vLo=0,sr=48000,nf=.005;
async function micStart(){
  /* 許可ダイアログより前（タップした瞬間）に、読み上げの解錠とAudioContextの開始をしておく */
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}
  ac=new (window.AudioContext||window.webkitAudioContext)();
  try{ac.resume()}catch(e){}
  try{
    ms=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:ec,noiseSuppression:ns,autoGainControl:agc}});
  }catch(e){try{ac.close()}catch(x){}ac=null;show('sys','マイクを使えません。ブラウザのマイク許可を確認してください');return}
  await ac.resume();
  sr=ac.sampleRate;
  const src=ac.createMediaStreamSource(ms);
  an=ac.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=.75;fd=new Uint8Array(an.frequencyBinCount);
  proc=ac.createScriptProcessor(4096,1,1);proc.onaudioprocess=onAudio;
  const mute=ac.createGain();mute.gain.value=0;
  const hp=ac.createBiquadFilter();hp.type='highpass';hp.frequency.value=100;
  src.connect(hp);hp.connect(an);hp.connect(proc);proc.connect(mute);mute.connect(ac.destination);
  micOn=true;talking=false;pre=[];buf=[];setSt('idle');
  try{wl=await navigator.wakeLock.request('screen')}catch(e){}
}
function micStop(){
  talking=false;buf=[];pre=[];spTok++;turnId++;carry='';if(ctl){try{ctl.abort()}catch(e){}}
  try{speechSynthesis.cancel()}catch(e){}
  if(proc){proc.onaudioprocess=null;try{proc.disconnect()}catch(e){}}
  if(ms)ms.getTracks().forEach(t=>t.stop());
  if(ac)ac.close();
  if(wl){try{wl.release()}catch(e){}}
  proc=ms=ac=an=fd=wl=null;micOn=false;setSt('idle');
}
function onAudio(e){
  const x=new Float32Array(e.inputBuffer.getChannelData(0));
  let s=0;for(let i=0;i<x.length;i++)s+=x[i]*x[i];
  const rms=Math.sqrt(s/x.length),dur=x.length/sr;
  const base=Math.max(.015,nf*3)/sens;
  lastRms=rms;lastBase=base;
  if(performance.now()<hold&&rms<base*3)return;
  if(st==='idle'&&!talking&&rms<base)nf=nf*.97+rms*.03;
  const speakingNow=st==='speak';
  const hi=speakingNow?Math.max(.03,base*1.8)/bsens:base;
  if(!talking){
    pre.push(x);if(pre.length>4)pre.shift();
    vHi=rms>hi?vHi+dur:Math.max(0,vHi-dur);
    if(vHi>=(speakingNow?.25:.12)){
      talking=true;buf=pre.slice();pre=[];vHi=0;vLo=0;
      turnId++;if(ctl){try{ctl.abort()}catch(e){}ctl=null}
      if(speakingNow){spTok++;try{speechSynthesis.cancel()}catch(e){}}
      setSt('listen');
    }
  }else{
    buf.push(x);
    vLo=rms>base*.7?0:vLo+dur;
    if(vLo>=gap||buf.length*dur>20)finishUtter();
  }
}
async function finishUtter(){
  talking=false;vLo=0;
  const my=turnId,ch=buf;buf=[];
  let n=0;ch.forEach(c=>n+=c.length);
  if(n/sr<.6){if(carry){const c=carry;carry='';ask(c)}else setSt('idle');return}
  setSt('think');
  try{
    const t=await stt(toWav(ch));
    const junk=t.length<2||/ご視聴ありがとう|チャンネル登録/.test(t);
    if(my!==turnId){if(!junk)carry=(carry+' '+t).trim();return}
    if(junk&&!carry){setSt('idle');return}
    const full=(carry+' '+(junk?'':t)).trim();carry='';
    ask(full);
  }catch(e){if(my===turnId){setSt('idle');show('sys',String(e.message||e))}}
}
async function stt(wav,retry){
  const h={'content-type':'application/octet-stream'};
  const pw=store.get('pw','');if(pw)h['x-pass']=pw;
  const res=await fetch('/api/stt',{method:'POST',headers:h,body:wav});
  if(res.status===401&&!retry){
    const p=prompt('合言葉を入力してください');
    if(p){store.set('pw',p);return stt(wav,true)}
  }
  if(res.status===404)throw new Error('api/stt.js が見つかりません。GitHubのapiフォルダに追加してください');
  const j=await res.json().catch(()=>({}));
  if(!res.ok)throw new Error(j.error||('文字起こしエラー '+res.status));
  return String(j.text||'').trim();
}
function toWav(ch){
  let n=0;ch.forEach(c=>n+=c.length);
  const all=new Float32Array(n);let o=0;ch.forEach(c=>{all.set(c,o);o+=c.length});
  const r=sr/16000,m=Math.floor(n/r),pcm=new Int16Array(m);
  for(let i=0;i<m;i++){
    const a=Math.floor(i*r),b=Math.max(a+1,Math.floor((i+1)*r));let s=0;
    for(let k=a;k<b&&k<n;k++)s+=all[k];
    const v=Math.max(-1,Math.min(1,s/(b-a)));pcm[i]=v<0?v*32768:v*32767;
  }
  const w=new DataView(new ArrayBuffer(44+m*2)),T=(p,t)=>{for(let i=0;i<t.length;i++)w.setUint8(p+i,t.charCodeAt(i))};
  T(0,'RIFF');w.setUint32(4,36+m*2,true);T(8,'WAVE');T(12,'fmt ');w.setUint32(16,16,true);
  w.setUint16(20,1,true);w.setUint16(22,1,true);w.setUint32(24,16000,true);w.setUint32(28,32000,true);
  w.setUint16(32,2,true);w.setUint16(34,16,true);T(36,'data');w.setUint32(40,m*2,true);
  new Int16Array(w.buffer,44,m).set(pcm);
  return w.buffer;
}
$('bk').onclick=()=>micOn?micStop():micStart();
setInterval(()=>{
  if(!micOn)return;
  resumeAc();
  if(ms&&ms.getAudioTracks().some(t=>t.readyState==='ended')){micStop();show('sys','マイクが切れました。もう一度「マイクON」を押してください');return}
  if(st==='think'&&Date.now()-stSince>45000){setSt('idle');show('sys','返事が来なかったので待機に戻しました')}
  if(st==='speak'&&Date.now()-stSince>1000){const sy=window.speechSynthesis;if(sy&&!sy.speaking&&!sy.pending)speakDone(spTok)}
  if(st==='listen'&&Date.now()-stSince>30000){talking=false;buf=[];setSt('idle')}
},300);
/* 画面中央をタップすると、読み上げや聞き取りを止めて待機に戻す */
cv.onclick=()=>{if(!micOn)return;turnId++;carry='';if(ctl){try{ctl.abort()}catch(e){}}spTok++;try{speechSynthesis.cancel()}catch(e){}muteMic(false);talking=false;buf=[];pre=[];setSt('idle')};
document.addEventListener('visibilitychange',resumeAc);

/* 声の設定 */
function jaVoices(){return window.speechSynthesis?speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith('ja')):[]}
function fillVoices(){
  const vs=jaVoices(),sel=$('vs');
  sel.textContent='';
  if(!vs.length){const o=document.createElement('option');o.value='';o.textContent='日本語の声が見つかりません';sel.appendChild(o);return}
  vs.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name;sel.appendChild(o)});
  sel.value=vs.some(v=>v.name===vname)?vname:vs[0].name;
}
function preview(){
  const syn=window.speechSynthesis;if(!syn)return;
  if(st==='speak'){setSt('idle');muteMic(false)}
  spTok++;syn.cancel();hold=performance.now()+5000;
  const u=new SpeechSynthesisUtterance('こんにちは。この声でお話しします。');
  u.lang='ja-JP';u.rate=vrate;u.pitch=vpitch;
  const v=jaVoices().find(x=>x.name===vname)||jaVoices()[0];if(v)u.voice=v;
  syn.speak(u);
}
$('bv').onclick=()=>{const p=$('vp');p.style.display=p.style.display==='flex'?'none':'flex';vpOpen=p.style.display==='flex';fillVoices()};
$('vs').onchange=e=>{vname=e.target.value;store.set('vname',vname);preview()};
$('vr').oninput=e=>{vrate=+e.target.value;store.set('vrate',vrate)};
$('vt').oninput=e=>{vpitch=+e.target.value;store.set('vpitch',vpitch)};
$('vr').value=vrate;$('vt').value=vpitch;
$('vtest').onclick=preview;
function applyMic(){
  if(ms)ms.getAudioTracks().forEach(t=>{try{t.applyConstraints({noiseSuppression:ns,echoCancellation:ec,autoGainControl:agc}).catch(()=>{})}catch(e){}});
}
function syncMic(){$('cn').checked=ns;$('ce').checked=ec;$('ca').checked=agc;$('ss').value=sens;$('sb').value=bsens;$('sg').value=gap}
$('cn').onchange=e=>{ns=e.target.checked;store.set('ns',ns);applyMic()};
$('ce').onchange=e=>{ec=e.target.checked;store.set('ec',ec);applyMic()};
$('ca').onchange=e=>{agc=e.target.checked;store.set('agc',agc);applyMic()};
$('ss').oninput=e=>{sens=+e.target.value;store.set('sens',sens)};
$('sb').oninput=e=>{bsens=+e.target.value;store.set('bsens',bsens)};
$('sg').oninput=e=>{gap=+e.target.value;store.set('gap',gap)};
$('sreset').onclick=()=>{ns=ec=agc=true;sens=bsens=gap=1;['ns','ec','agc'].forEach(k=>store.set(k,true));['sens','bsens','gap'].forEach(k=>store.set(k,1));syncMic();applyMic()};
syncMic();
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=fillVoices;
fillVoices();

$('bt').onclick=()=>{ti=(ti+1)%THN.length;store.set('ti',ti);applyTheme()};

/* 描画: 解析中は、画像のような青白いモヤモヤ（雲）を出す */
let cloudA=0,spr=null,sprKey='';
function sprite(c1,c2){
  const k=c1+c2;if(spr&&sprKey===k)return spr;
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d'),gr=x.createRadialGradient(64,64,0,64,64,64);
  gr.addColorStop(0,c2);gr.addColorStop(.35,c1);gr.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=gr;x.fillRect(0,0,128,128);spr=c;sprKey=k;return c;
}
function cloud(cx,cy,t,CR,c1,c2){
  const sp=sprite(c1,c2);
  g.save();g.setLineDash([]);g.globalCompositeOperation='lighter';
  const pulse=1+.06*Math.sin(t*1.3);
  for(let i=0;i<70;i++){
    const ph=i*1.618,a=ph*2.4+t*(.12+(i%5)*.03)*(i%2?1:-1);
    const rr=CR*(.25+((i*53)%100)/100*.95)*pulse;
    const x=cx+Math.cos(a)*rr*1.1+Math.sin(t*.7+ph)*CR*.06;
    const y=cy+Math.sin(a)*rr*.85+Math.cos(t*.6+ph*1.3)*CR*.06;
    const sz=CR*(.28+((i*29)%100)/100*.45);
    g.globalAlpha=cloudA*(.07+.07*Math.abs(Math.sin(t*.9+ph)));
    g.drawImage(sp,x-sz/2,y-sz/2,sz,sz);
  }
  g.globalCompositeOperation='source-over';g.strokeStyle=c1;g.lineWidth=1;
  for(let i=0;i<14;i++){
    const yy=cy-CR*1.1+i*CR*.17,d=Math.sin(t*.5+i)*6;
    g.globalAlpha=cloudA*.14;g.beginPath();g.moveTo(cx-CR*1.7,yy+d);g.lineTo(cx+CR*1.7,yy-d);g.stroke();
  }
  g.fillStyle=c2;
  for(let i=0;i<50;i++){
    const a=i*2.17+t*.05,r=CR*(.3+((i*61)%100)/100*1.3);
    g.globalAlpha=cloudA*(.2+.6*Math.abs(Math.sin(t*2+i)));
    g.beginPath();g.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.8,1.2,0,7);g.fill();
  }
  g.restore();
}
/* 描画 */
function ring(cx,cy,t,r,w,dash,sp,al,col){
  g.save();g.translate(cx,cy);g.rotate(t*sp);g.beginPath();g.arc(0,0,r,0,7);
  g.setLineDash(dash);g.lineWidth=w;g.globalAlpha=al;g.strokeStyle=col;g.stroke();g.restore();
}
function fr(ms_){
  const t=ms_/1000,[c1,c2]=TH[THN[ti]];
  g.clearRect(0,0,W,H);
  if(vpOpen){const db=v=>Math.max(0,Math.min(1,(20*Math.log10(Math.max(v,1e-5))+60)/60))*100;$('mbar').style.width=db(lastRms)+'%';$('mth').style.left=db(lastBase)+'%'}
  let tl=0;
  if(an&&(st==='idle'||st==='listen')){an.getByteFrequencyData(fd);let s=0;for(let i=0;i<48;i++)s+=fd[i];tl=Math.min(1,s/48/255*2.2)}
  else if(st==='listen')tl=.25+.2*Math.abs(Math.sin(t*5)*Math.sin(t*2.3));
  else if(st==='speak')tl=.3+.45*Math.abs(Math.sin(t*9)*Math.sin(t*3.1));
  else if(st==='think')tl=.12+.1*Math.sin(t*6);
  lv+=(tl-lv)*.25;
  const spin=st==='think'?3:1;
  const cx=W/2,cy=H*.37,R=Math.min(W*.4,H*.21),e=Math.min(1,lv+.06+.03*Math.sin(t*1.5));
  cloudA+=((st==='think'?1:0)-cloudA)*(st==='think'?.06:.04);
  if(cloudA>.01)cloud(cx,cy,t,Math.min(W*.5,H*.3),c1,c2);

  const gr=g.createRadialGradient(cx,cy,0,cx,cy,R*.7);
  gr.addColorStop(0,c2);gr.addColorStop(.3,c1);gr.addColorStop(1,'rgba(0,0,0,0)');
  g.globalAlpha=.12+e*.55;g.fillStyle=gr;g.beginPath();g.arc(cx,cy,R*.7,0,7);g.fill();

  ring(cx,cy,t,R*1.08,1.5,[2,7],.08*spin,.6,c1);
  ring(cx,cy,t,R*.9,3,[R*.45,R*.14],-.25*spin,.5+e*.5,c1);
  ring(cx,cy,t,R*.5,1.5,[4,5],.5*spin,.55,c2);
  ring(cx,cy,t,R*.38,6,[R*.3,R*.1,R*.05,R*.1],.9*spin,.6+e*.4,c1);

  const N=64;g.setLineDash([]);g.strokeStyle=c2;g.lineWidth=2.2;g.lineCap='round';
  for(let i=0;i<N;i++){
    const a=i/N*Math.PI*2-Math.PI/2,k=i<N/2?i:N-1-i;
    const v=(fd&&(st==='idle'||st==='listen'))?fd[k*2]/255:(.05+lv*(.4+.6*Math.abs(Math.sin(t*8+k*.7))));
    const r0=R*.62,r1=r0+R*.22*(v+.06);
    g.globalAlpha=.35+v*.65;g.beginPath();
    g.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);
    g.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);g.stroke();
  }

  const T=36,lit=Math.round((lv*1.6+.12)*T);
  g.strokeStyle=c1;g.lineWidth=3;
  for(let i=0;i<T;i++){
    const a=i/T*Math.PI*2-Math.PI/2,r0=R*1.14,r1=R*1.2;
    g.globalAlpha=i<lit?.95:.18;g.beginPath();
    g.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);
    g.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);g.stroke();
  }

  g.fillStyle=c2;
  for(let i=0;i<90;i++){
    const a=i*2.399+t*(.05+(i%7)*.012),r=R*(.3+((i*37)%100)/100*1.0);
    g.globalAlpha=.2+lv*.7;g.beginPath();
    g.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,1+lv*2.2,0,7);g.fill();
  }

  g.globalAlpha=.9;g.fillStyle=c2;g.font='700 15px ui-monospace,Menlo,monospace';
  g.textAlign='center';g.textBaseline='middle';g.fillText(st==='think'?'ANALYZING':'O R R E R Y',cx,cy);
  g.globalAlpha=1;
  requestAnimationFrame(fr);
}
if(window.speechSynthesis)speechSynthesis.getVoices();
if(hist.length&&hist[hist.length-1].role==='user')hist.pop();
applyTheme();setSt('idle');weather();setInterval(weather,600000);requestAnimationFrame(fr);
